import requests
import json
import os

# 配置
NEODB_TOKEN = os.getenv('NEODB_TOKEN')
USER_ID = "Van_Debiao" # 替换为你的用户名
OUTPUT_FILE = "src/content/movies.json"

def fetch_neodb_movies():
    url = f"https://neodb.social/api/me/shelf/complete?category=movie"
    headers = {'Authorization': f'Bearer {NEODB_TOKEN}', 'Accept': 'application/json'}
    
    response = requests.get(url, headers=headers)
    if response.status_code != 200:
        print(f"Error: {response.status_code}")
        return []

    data = response.json()
    movies = []
    
    for item in data.get('data', []):
        item_data = item.get('item', {})
        movies.append({
            "title": item_data.get('title'),
            "poster": item_data.get('cover_image_url'),
            "rating": item.get('rating'),
            "date": item.get('created_time')[:10], # 只取日期部分
            "link": f"https://neodb.social{item_data.get('url')}"
        })
    return movies

if __name__ == "__main__":
    movie_list = fetch_neodb_movies()
    if movie_list:
        with open(OUTPUT_FILE, 'w', encoding='utf-8') as f:
            json.dump(movie_list, f, ensure_ascii=False, indent=2)
        print(f"成功同步 {len(movie_list)} 部电影")
