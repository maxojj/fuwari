name: Sync NeoDB Movies

on:
  schedule:
    - cron: '0 16 * * *' # 每天北京时间 0 点运行
  workflow_dispatch:      # 允许你手动点击按钮运行
  # 去掉 push: 这一行，这样你平时改代码，它就不会跑

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Data
        env:
          NEODB_TOKEN: ${{ secrets.NEODB_TOKEN }}
        run: python scripts/sync_neodb.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/movies.json
          git commit -m "chore: sync movies from NeoDB" || exit 0
          git push
