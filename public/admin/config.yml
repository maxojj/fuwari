backend:
  name: github
  repo: maxojj/fuwari
  branch: main
  base_url: https://decap-cms-oss-oauth.vercel.app

media_folder: "src/assets/images"
public_folder: "src/assets/images"

collections:
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "src/content/posts"
    extension: "md"
    format: "frontmatter"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{english_slug}}"
    
    fields:
      - { label: "标题 (中文标题)", name: "title", widget: "string" }
      
      - { 
          label: "URL 英文名 (用于链接，例如: my-new-post)", 
          name: "english_slug", 
          widget: "string", 
          hint: "只能填英文、数字和横杠，用于生成文件名" 
        }

      - { label: "发布日期", name: "published", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "描述", name: "description", widget: "string", required: false }
      - { label: "封面图片", name: "image", widget: "image", required: false }
      
      # 标签配置：使用 list，适合输入多个值
      - { 
          label: "标签", 
          name: "tags", 
          widget: "list", 
          required: false,
          hint: "输入后按回车添加多个标签"
        }

      # 分类配置：动态获取已有文章的分类
      - { 
          label: "分类", 
          name: "category", 
          widget: "relation", 
          collection: "posts",      # 搜索 posts 集合
          search_fields: ["category"], # 搜索 category 字段
          value_field: "category",     # 存储的值
          display_fields: ["category"], # 显示的值
          required: false 
        }

      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "正文内容", name: "body", widget: "markdown" }

      # --- 以下为 Fuwari 模板需要的隐藏字段，确保数据结构完整性 ---
      - { label: "prevTitle", name: "prevTitle", widget: "hidden", default: "" }
      - { label: "prevSlug", name: "prevSlug", widget: "hidden", default: "" }
      - { label: "nextTitle", name: "nextTitle", widget: "hidden", default: "" }
      - { label: "nextSlug", name: "nextSlug", widget: "hidden", default: "" }
      - { label: "语言", name: "lang", widget: "hidden", default: "" }
