backend:
  name: github
  repo: maxojj/fuwari  # 修改这里
  branch: main             # 你的默认分支名
  base_url: https://decap-cms-oss-oauth.vercel.app

# 媒体文件存放在哪里（Fuwari 默认通常是 public/assets）
media_folder: "src/assets/images"
public_folder: "src/assets/images"

collections:
  - name: "posts"
    label: "文章"
    label_singular: "文章"
    folder: "src/content/posts"  # Fuwari 的文章存放位置
    extension: "md"              # 或者 "mdx"，取决于你用的格式
    format: "frontmatter"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "published", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "描述", name: "description", widget: "string", required: false }
      - { label: "封面图片", name: "image", widget: "image", required: false }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "分类", name: "category", widget: "string", required: false }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "正文内容", name: "body", widget: "markdown" }
